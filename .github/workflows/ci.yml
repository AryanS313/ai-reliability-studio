name: reliability-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
      - name: Verify pinned browser dependency builder
        run: python -m unittest discover -s browser_runtime/dependencies -p 'test_*.py' -v
      - name: Verify synthetic workflow is explicitly blocked from launch
        shell: bash
        run: |
          set +e
          python -m src.cli run \
            --dataset examples/evaluation_dataset_v1.jsonl \
            --document data/sample_docs/refund_policy.md \
            --document data/sample_docs/kyc_policy.md \
            --document data/sample_docs/loan_rejection_sop.md \
            --document data/sample_docs/account_closure_policy.md \
            --document data/sample_docs/customer_support_escalation_sop.md \
            --prompt prompts/current_prompt_sample.md \
            --model mock-model \
            --output synthetic-workflow-report.json
          exit_code=$?
          set -e
          test "$exit_code" -eq 2
          python -c "import json; r=json.load(open('synthetic-workflow-report.json')); assert all(v['verdict']=='Synthetic demonstration — no launch verdict' for v in r['candidates'].values())"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-artifacts-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            synthetic-workflow-report.json

  browser-build:
    name: Browser distribution build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: browser_site/package-lock.json
      - name: Build pinned runtime assets
        working-directory: browser_site
        run: |
          python ../browser_runtime/dependencies/build_dependencies.py --output .build/browser-vendor --cache .cache/browser-dependencies
          python scripts/assemble-runtime.py --source ..
      - name: Verify browser retry handling without provider calls
        run: node --test browser_runtime/tests/fetch-worker-retry.test.mjs
      - name: Check and build the web wrapper
        working-directory: browser_site
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build

  postgres-integration:
    name: PostgreSQL migration and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/ars_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest -m postgres tests/test_postgres_integration.py --no-cov -q

  container-smoke:
    name: Public container startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the exact runtime image
        run: docker build -t studio-public-ci .
      - name: Verify a non-root healthy web process
        shell: bash
        run: |
          docker run --detach --name studio-public-ci -p 127.0.0.1:8501:8501 studio-public-ci
          trap 'docker logs studio-public-ci; docker rm --force studio-public-ci' EXIT
          test "$(docker exec studio-public-ci id -u)" = "10001"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Exercise the sample in the runtime image
        run: |
          docker run --rm --memory=512m --network=none -i studio-public-ci python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("app.py").run(timeout=60)
          assert not app.exception, app.exception
          app.button(key="start_sample").click().run(timeout=60)
          assert not app.exception, app.exception
          results = app.session_state["offline_baseline"]
          assert len(results) == 3
          assert results["review_status"].eq("pending").all()
          assert len(app.get("download_button")) == 4
          app.session_state["_studio_private_session"].close()
          PY
